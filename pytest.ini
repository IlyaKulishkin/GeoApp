[pytest]
DJANGO_SETTINGS_MODULE = geopointsapp.settings
# Пути для поиска тестов
testpaths = points/tests

# Паттерны файлов с тестами
python_files = test_*.py *_test.py

# Паттерны классов с тестами
python_classes = Test*

# Паттерны функций с тестами
python_functions = test_*

# Дополнительные опции по умолчанию
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Маркеры
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests

# Фильтры предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

