services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geopoints
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://geouser:geopass@db:5432/geopoints

volumes:
  postgres_data: