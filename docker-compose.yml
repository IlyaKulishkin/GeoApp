services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    env_file: .env.local
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: web

  celery:
    build: .
    env_file: .env.local
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    command: celery -A geopointsapp worker --loglevel=info

volumes:
  postgres_data:
  redis_data: