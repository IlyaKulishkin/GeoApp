services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    env_file: .env.local
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    command: web
    
  fastapi:
    build: ./fastapi_service
    env_file: .env.local
    ports: [ "8001:8001" ]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  fastapi_consumer:
    build: ./fastapi_service
    env_file: .env.local
    depends_on:
      rabbitmq:
        condition: service_started
      db:
        condition: service_healthy
    command: python rabbit_consumer.py
    restart: unless-stopped

  artifact_consumer:
    build: .
    env_file: .env.local
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_started
      db:
        condition: service_healthy
    command: python manage.py consume_artifacts
    restart: unless-stopped

  celery:
    build: .
    env_file: .env.local
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - rabbitmq
    command: celery -A geopointsapp worker --loglevel=info

volumes:
  postgres_data:
  redis_data: